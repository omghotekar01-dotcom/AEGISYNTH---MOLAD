name: AEGISYNTH Monad vault CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  vault-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependency tree (no secret keys)
        run: npm install --no-audit --no-fund
      - name: Policy evidence and browser syntax tests
        run: npm run demo:check
      - name: Compile Solidity
        run: npm run contracts:compile
      - name: Payment-vault security tests
        run: npm run contracts:test
      - name: Build browser payment dashboard
        run: npm run web3:build
